<!DOCTYPE html>
<html lang="ko" data-public="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세션 기록 · pz3d</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5 9 3l6 2.5L20 3v15.5L15 21l-6-2.5L4 21z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path><path d="M9 3v15.5M15 5.5V21" stroke="currentColor" stroke-width="1.8"></path></svg>세션 기록</div>
    <select class="server-select" id="server" aria-label="기록 서버"></select>
    <span class="live" id="live"><i></i><span id="live-text">서버 상태 확인 중</span></span>
    <div class="views" role="tablist" aria-label="화면"><button role="tab" data-view="records" aria-selected="true">기록</button><button role="tab" data-view="config" aria-selected="false" data-tip="모드 목록과 기본값에서 바꾼 샌드박스 설정(하우스 룰)을 봅니다.">서버 설정</button></div>
    <span class="spacer"></span>
    <button class="btn share admin" id="share" data-tip="친구들에게 보낼 읽기 전용 주소(Radmin IP)를 봅니다."><span class="dot"></span><span>친구 주소</span></button>
    <button class="rec admin" id="rec" aria-pressed="false"><span class="dot"></span><span id="rec-text">기록 시작</span></button>
    <button class="icon-btn" id="refresh" aria-label="새로고침" data-tip="기록을 다시 읽습니다. 15초마다 자동으로도 갱신됩니다."><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    <button class="icon-btn" id="more" aria-label="더 보기" aria-haspopup="menu"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8" fill="currentColor"></circle><circle cx="12" cy="12" r="1.8" fill="currentColor"></circle><circle cx="19" cy="12" r="1.8" fill="currentColor"></circle></svg></button>
  </header>

  <nav class="rail" aria-label="세션 목록">
    <h2>세션</h2>
    <div class="list" id="list"></div>
  </nav>

  <main class="work" id="work">
    <div class="head">
      <div>
        <h1 id="title">불러오는 중…</h1>
        <div class="sub" id="subtitle"></div>
      </div>
      <span class="badge" id="state" hidden></span>
      <span class="grow"></span>
      <button class="btn admin" id="open-folder" data-tip="이 기록의 폴더를 탐색기로 엽니다."><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.8"></path></svg>폴더</button>
      <button class="btn admin" id="ai" data-tip="기록을 바탕으로 세션 이야기와 날짜별 생존 일지를 AI로 새로 씁니다. 이 PC에서만 누를 수 있습니다.">AI 요약 갱신</button>
      <button class="btn primary admin" id="finalize" hidden>마감하기</button>
    </div>
    <div class="metrics" id="metrics"></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="map">지도</button>
      <button class="tab" role="tab" data-tab="summary">요약</button>
      <button class="tab" role="tab" data-tab="days">날짜별</button>
      <button class="tab" role="tab" data-tab="events">사건</button>
      <button class="tab" role="tab" data-tab="files">파일</button>
      <div class="tab-tools" id="tab-tools"></div>
    </div>
    <section class="pane" id="pane"></section>
  </main>
  <main class="config" id="config" hidden></main>
</div>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
// GitHub Pages copy: config.js sets PZ_DATA to the Supabase Storage folder this PC publishes to (read-only, no tunnel)
const STATIC = window.PZ_DATA || null;
const PUBLIC = document.documentElement.hasAttribute('data-public') || !!STATIC;  // friends: read-only
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => v === null || v === undefined ? '—' : Number(v).toLocaleString();
const S = {view:'records', config:null, server:null, id:null, tab:'map', state:null, detail:null, dayIdx:-1, evQuery:'', evKind:'', evPlayer:'', evLimit:300, mapKey:null};
try { Object.assign(S, JSON.parse(localStorage.getItem('pz-app') || '{}'), {state:null, detail:null, mapKey:null, config:null}); } catch (e) {}
const save = () => { try { localStorage.setItem('pz-app', JSON.stringify({view:S.view, id:S.id, tab:S.tab})); } catch (e) {} };

let lastState = null;
async function staticGet(rel, v){
  const r = await fetch(STATIC + rel + '?v=' + (v || Date.now()), {cache:'no-store'});
  if (!r.ok) throw new Error(r.status === 400 || r.status === 404 ? '아직 올라온 기록이 없습니다. 방장 PC에서 웹사이트를 켜면 올라옵니다.' : 'HTTP ' + r.status);
  return r.json();
}
async function staticApi(path){
  const [p, qs] = path.split('?'), id = new URLSearchParams(qs || '').get('id');
  if (p === '/api/state'){
    const st = await staticGet('state.json');
    st.public = true;
    // no heartbeat for 2 minutes = the host PC (and its recorder) is off: nothing is live any more
    if (Date.now() - (st.published || 0) > 120000){ st.live = {status:'off', port:(st.live || {}).port}; st.watcher = false; st.records.forEach(r => { if (r.state === 'live') r.state = 'open'; }); }
    return lastState = st;
  }
  if (p === '/api/record'){
    const r = ((lastState || {}).records || []).find(x => x.id === id);
    const rec = await staticGet('records/' + String(id).replace('session:', '') + '.json', r && r.ver);
    if (r) rec.state = r.state;
    return rec;
  }
  if (p === '/api/config') return staticGet('config.json');
  throw new Error('이 페이지에서는 쓸 수 없는 기능입니다.');
}
async function api(path, body){
  if (STATIC){ if (body) throw new Error('읽기 전용 페이지입니다.'); return staticApi(path); }
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
  return data;
}
const q = o => Object.entries(o).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
const fileUrl = path => STATIC ? STATIC + 'files/' + String(S.id).replace('session:', '') + '/' + path.split(/[\\/]/).map(encodeURIComponent).join('/') : '/api/file?' + q({id:S.id, path});
const posterUrl = id => STATIC ? STATIC + 'posters/' + encodeURIComponent(id) : '/api/poster?id=' + encodeURIComponent(id);

/* ---------- formatting ---------- */
const WEEK = ['일','월','화','수','목','금','토'];
function recName(name){ const [d, t] = name.split('_'); const [y, m, dd] = d.split('-').map(Number); const w = WEEK[new Date(y, m - 1, dd).getDay()]; return `${m}월 ${dd}일 (${w}) ${t.replace('-', ':')}`; }
function gameDate(date){ const [y, m, d] = date.split('-').map(Number); return `${y}년 ${m}월 ${d}일`; }
const shortGame = date => { const [, m, d] = date.split('-').map(Number); return `${m}/${d}`; };
const STATE = {live:['진행 중','live','기록기가 지금 모으고 있는 세션입니다. 플레이를 마치면 마감하세요.'], final:['마감됨','','확정된 기록입니다. 친구들도 볼 수 있습니다.'], open:['미마감','open','기록을 멈췄지만 아직 마감하지 않은 세션입니다. 마감하면 친구들에게 공개됩니다.']};
function prose(md){
  const out = []; let list = false;
  for (const raw of md.replace(/<!--[\s\S]*?-->/g, '').split(/\n/)){
    const line = raw.trim();
    if (/^[-*] /.test(line)){ if (!list){ out.push('<ul>'); list = true; } out.push('<li>' + esc(line.slice(2)) + '</li>'); continue; }
    if (list){ out.push('</ul>'); list = false; }
    if (!line) continue;
    const h = line.match(/^#{1,4}\s+(.*)/);
    out.push(h ? '<h3>' + esc(h[1]) + '</h3>' : '<p>' + esc(line) + '</p>');
  }
  if (list) out.push('</ul>');
  return out.join('');
}

/* ---------- tooltip / modal / toast ---------- */
const tip = $('tip');
document.addEventListener('mouseover', ev => {
  const el = ev.target.closest('[data-tip]');
  if (!el || !el.dataset.tip){ tip.hidden = true; return; }
  tip.textContent = el.dataset.tip; tip.hidden = false;
  const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  let x = r.left + r.width / 2 - w / 2, y = r.bottom + 8;
  if (y + h > innerHeight - 8) y = r.top - h - 8;
  tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x)) + 'px'; tip.style.top = y + 'px';
});
document.addEventListener('scroll', () => tip.hidden = true, true);
function modal({title, body = '', text = null, actions}){
  return new Promise(resolve => {
    const back = document.createElement('div'); back.className = 'modal-back';
    back.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><div class="body">${body}${text !== null ? `<textarea readonly>${esc(text)}</textarea>` : ''}</div><div class="actions"></div></div>`;
    const bar = back.querySelector('.actions');
    const close = v => { back.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    actions.forEach(a => { const b = document.createElement('button'); b.className = 'btn' + (a.primary ? ' primary' : '') + (a.left ? ' left' : ''); b.textContent = a.label;
      b.onclick = async () => { if (a.run){ const keep = await a.run(b); if (keep) return; } close(a.value); }; bar.append(b); });
    const onKey = e => { if (e.key === 'Escape') close(null); };
    document.addEventListener('keydown', onKey);
    back.addEventListener('click', e => { if (e.target === back) close(null); });
    document.body.append(back);
    (back.querySelector('.btn.primary') || back.querySelector('.btn')).focus();
  });
}
const copy = async (text, b) => { try { await navigator.clipboard.writeText(text); } catch (e) { const t = document.querySelector('.modal textarea, .link-box input'); if (t){ t.select(); document.execCommand('copy'); } } b.textContent = '복사됨'; return true; };
function showError(title, message){
  const text = `[${new Date().toLocaleString()}] ${title}\n${message}`;
  return modal({title, body:'<p>아래 내용을 그대로 복사해 전달할 수 있습니다.</p>', text, actions:[
    ...(PUBLIC ? [] : [{label:'로그 파일 열기', left:true, run:async () => { try { await api('/api/open', {log:true}); } catch (e) {} return true; }}]),
    {label:'복사', run:b => copy(text, b)}, {label:'닫기', primary:true}]});
}
let toastTimer = null;
function toast(html, ms){ const t = $('toast'); t.innerHTML = html; t.hidden = false; clearTimeout(toastTimer); if (ms) toastTimer = setTimeout(() => t.hidden = true, ms); }
if (!PUBLIC) window.addEventListener('error', e => api('/api/log', {title:'화면 오류', message:String(e.error && e.error.stack || e.message)}).catch(() => {}));

/* ---------- state ---------- */
async function loadState(){
  try {
    const st = await api('/api/state');
    S.state = st; S.server = st.server;
    renderTop(); renderList();
    const recs = st.records;
    if (!recs.find(r => r.id === S.id)) S.id = (recs.find(r => r.state === 'live') || recs[0] || {}).id || null;
    const cur = recs.find(r => r.id === S.id);
    if (!S.detail || S.detail.id !== S.id || (cur && cur.state === 'live') || (cur && S.detail.state !== cur.state)) await loadDetail();
    save();
  } catch (e) {
    $('title').textContent = '기록을 불러오지 못했습니다';
    $('subtitle').textContent = e.message;
  }
  // live session on screen: refresh every 3 s; otherwise every 15 s
  const liveOpen = S.detail && S.detail.state === 'live' && S.view === 'records';
  clearTimeout(loadState.timer); loadState.timer = setTimeout(loadState, liveOpen ? 3000 : 15000);
}

function renderTop(){
  const st = S.state;
  $('server').innerHTML = st.servers.map(s => `<option ${s === st.server ? 'selected' : ''}>${esc(s)}</option>`).join('');
  const live = st.live || {}, el = $('live');
  el.classList.toggle('on', live.status === 'running');
  $('live-text').textContent = live.status === 'running' ? `${live.server_name} 실행 중` : live.status === 'off' ? '게임 서버 꺼짐' : '서버 상태 확인 중';
  el.dataset.tip = `포트 ${live.port || 16261}의 게임 서버 상태입니다. 꺼져 있어도 저장된 기록은 볼 수 있습니다.`;
  const rec = $('rec');
  rec.classList.toggle('on', st.watcher);
  $('rec-text').textContent = st.watcher ? '기록 중' : '기록 시작';
  rec.setAttribute('aria-pressed', st.watcher);
  rec.dataset.tip = st.watcher ? '기록기가 서버 로그를 실시간으로 세션에 모으는 중입니다. 누르면 기록을 멈춥니다. 게임 서버는 계속 실행됩니다.'
    : '누르면 새 세션을 만들고 지금부터의 서버 로그를 모읍니다. 게임 서버와는 별개입니다.';
}

function renderList(){
  const recs = S.state.records;
  const row = r => { const [label, cls, tipText] = STATE[r.state] || STATE.open;
    return `<button class="item" data-id="${esc(r.id)}" aria-current="${r.id === S.id}"><span class="t">${esc(recName(r.name))}</span><span class="badge ${cls}" data-tip="${esc(tipText)}">${label}</span><span class="s">${r.players}명</span></button>`; };
  const live = recs.filter(r => r.state !== 'final'), done = recs.filter(r => r.state === 'final');
  let html = '';
  if (live.length) html += `<div class="group">진행 중 · 미마감</div>` + live.map(row).join('');
  if (done.length) html += `<div class="group">마감됨</div>` + done.map(row).join('');
  $('list').innerHTML = html || `<div class="rail-empty">${PUBLIC ? '아직 세션이 없습니다.' : '아직 세션이 없습니다. 오른쪽 위 기록 시작을 누르면 지금부터 모읍니다.'}</div>`;
}

/* ---------- record detail ---------- */
async function loadDetail(){
  if (!S.id){ S.detail = null; renderDetail(); return; }
  try { S.detail = await api('/api/record?' + q({id:S.id})); }
  catch (e) { S.detail = null; $('title').textContent = '기록을 열지 못했습니다'; $('subtitle').textContent = e.message; return; }
  if (S.dayIdx >= S.detail.days.length) S.dayIdx = -1;
  renderDetail();
}

function renderDetail(){
  const d = S.detail;
  document.querySelectorAll('.item').forEach(b => b.setAttribute('aria-current', b.dataset.id === S.id));
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === S.tab));
  if (!d){ $('title').textContent = '세션을 고르세요'; $('subtitle').textContent = ''; $('metrics').innerHTML = ''; $('state').hidden = true; $('finalize').hidden = true; $('tab-tools').innerHTML = ''; $('pane').className = 'pane'; $('pane').innerHTML = '<div class="empty">왼쪽 목록에서 세션을 고르면 지도와 기록이 열립니다.</div>'; return; }
  $('title').textContent = (d.number ? `#${d.number} ` : '') + recName(d.name) + ' 세션';
  $('subtitle').textContent = d.dates.length ? `${gameDate(d.dates[0])}${d.dates.length > 1 ? ' – ' + shortGame(d.dates[d.dates.length - 1]) : ''} · 게임 ${d.dates.length}일` : '아직 게임 기록이 없습니다';
  const [label, cls, tipText] = STATE[d.state] || STATE.open;
  Object.assign($('state'), {hidden:false, textContent:label, className:'badge ' + cls}); $('state').dataset.tip = tipText;
  $('ai').hidden = !d.has_events; $('ai').textContent = d.story ? 'AI 요약 다시 쓰기' : 'AI 요약 만들기';
  const fin = $('finalize');
  fin.hidden = d.state === 'final';
  fin.dataset.tip = d.state === 'live' ? '기록을 멈추고 세션을 확정합니다. 마감한 세션은 친구들도 볼 수 있습니다.' : '세션을 확정하고 친구들에게 공개합니다.';
  const m = d.metrics;
  $('metrics').innerHTML = [
    ['플레이어', m.players, ''], ['캐릭터', m.characters, '사망 후 새로 만든 캐릭터도 따로 셉니다.'], ['사망', m.deaths, ''],
    ['킬', m.kills, '이 세션 동안 늘어난 좀비 킬 수입니다.'], ['게임 날짜', m.days, ''],
  ].map(([k, v, t]) => `<div class="metric" ${t ? `data-tip="${esc(t)}"` : ''}><b>${num(v)}</b><span>${k}</span></div>`).join('');
  // live refresh must not wipe what the viewer is typing or where they scrolled
  const pane = $('pane'), active = document.activeElement;
  if (pane.contains(active) && active.matches('input,select')) return;
  const scroll = pane.scrollTop;
  renderTab();
  pane.scrollTop = scroll;
}

function setTab(tab){ S.tab = tab; document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab)); save(); renderTab(); }
function renderTab(){
  const d = S.detail, pane = $('pane'), tools = $('tab-tools');
  tools.innerHTML = '';
  if (!d) return;
  pane.classList.toggle('flush', S.tab === 'map');
  if (S.tab === 'map') return renderMap(pane, tools);
  S.mapKey = null;
  if (S.tab === 'summary') return renderSummary(pane);
  if (S.tab === 'days') return renderDays(pane);
  if (S.tab === 'events') return renderEvents(pane);
  if (S.tab === 'files') return renderFiles(pane);
}

function renderMap(pane, tools){
  const d = S.detail, key = d.id;   // map page fetches new positions itself
  const src = 'map.html?' + q({id:d.id});
  tools.innerHTML = `<button class="btn" id="map-open" data-tip="지도를 새 탭에서 크게 엽니다.">새 탭에서 열기</button>`;
  $('map-open').onclick = () => window.open(src, '_blank');
  if (S.mapKey === key && pane.querySelector('iframe')) return;
  S.mapKey = key;
  pane.innerHTML = `<iframe class="map-frame" title="인터랙티브 지도" src="${src}#embed"></iframe>`;
}

function renderSummary(pane){
  const d = S.detail;
  const players = d.players.length ? `<table><thead><tr><th>플레이어</th><th class="num">캐릭터</th><th class="num">사망</th><th class="num" data-tip="이 세션 동안 늘어난 좀비 킬 수입니다.">킬</th><th class="num" data-tip="기록된 각 캐릭터의 마지막 킬 수를 더한 값입니다.">캐릭터 누계</th></tr></thead><tbody>${
    d.players.map(p => `<tr><td><b>${esc(p.name)}</b></td><td class="num">${num(p.characters)}</td><td class="num">${num(p.deaths)}</td><td class="num">${num(p.kills)}</td><td class="num">${num(p.kill_lifetime)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">플레이어 기록이 없습니다.</div>';
  const max = Math.max(1, ...d.counts.map(c => c[1]));
  const bars = d.counts.slice(0, 12).map(([k, n]) => `<div class="bar"><span>${esc(k)}</span><span class="track"><span class="fill" style="display:block;width:${(n / max * 100).toFixed(1)}%"></span></span><span class="n">${num(n)}</span></div>`).join('');
  // story.md is filled by a future AI summary step; until then it stays empty.
  const story = d.story ? `<div class="prose">${prose(d.story)}</div>` : `<div class="empty">세션 이야기가 아직 없습니다. 방장이 AI 요약을 갱신하면 나타납니다.</div>`;
  pane.innerHTML = `<div class="grid2">
    <div style="display:grid;gap:18px">
      <div><h3 class="section-title">플레이어</h3><div class="card">${players}</div></div>
      <div><h3 class="section-title">이야기</h3><div class="card">${story}</div></div>
    </div>
    <div style="display:grid;gap:18px">
      <div><h3 class="section-title">사건 종류</h3><div class="card bars">${bars || '<div class="empty">사건 기록이 없습니다.</div>'}</div></div>
    </div></div>`;
}

function renderDays(pane){
  const d = S.detail;
  if (!d.days.length){ pane.innerHTML = '<div class="empty">아직 게임 날짜가 기록되지 않았습니다.</div>'; return; }
  if (S.dayIdx < 0) S.dayIdx = d.days.length - 1;
  const day = d.days[S.dayIdx];
  const list = d.days.map((x, i) => `<button class="day" data-day="${i}" aria-current="${i === S.dayIdx}"><span class="d">${esc(shortGame(x.date))} · ${i + 1}일차</span>${x.diary ? '<span class="badge">일지</span>' : ''}<span class="m">${x.players.length}명 · 사망 ${x.deaths.length} · 킬 ${num(x.kills)}</span></button>`).join('');
  const deaths = day.deaths.map(x => `<div class="hl"><time>${esc(x.time || '')}</time><span><b>${esc(x.player)} #${esc(x.character)}</b> 사망 <span class="note mono">${esc(x.coordinates || '')}</span></span></div>`).join('');
  const hls = day.highlights.map(h => `<div class="hl"><time>${esc(h.time)}</time><span><b>${esc(h.who)}</b> · ${esc(h.what)}${h.detail ? ` <span class="note">${esc(h.detail)}</span>` : ''}</span></div>`).join('');
  pane.innerHTML = `<div class="days"><div class="daylist">${list}</div><div style="display:grid;gap:18px;min-width:0">
    <div><h3 class="section-title">${esc(gameDate(day.date))}</h3><div class="chips">${day.players.map(p => `<span class="chip">${esc(p)}</span>`).join('') || '<span class="note">플레이어 없음</span>'}</div></div>
    <div><h3 class="section-title">생존 일지</h3><div class="card">${day.diary ? `<div class="prose">${prose(day.diary)}</div>` : '<div class="empty">일지가 아직 없습니다. 방장이 AI 요약을 갱신하면 나타납니다.</div>'}</div></div>
    <div><h3 class="section-title">하이라이트</h3><div class="card" style="padding:4px 16px">${deaths + hls || '<div class="empty">이날의 주요 사건이 없습니다.</div>'}</div></div>
  </div></div>`;
}

function renderEvents(pane){
  const d = S.detail;
  const kinds = [...new Set(d.events.map(e => e[5]))].sort(), people = [...new Set(d.events.map(e => e[3]).filter(Boolean))].sort();
  pane.innerHTML = `<div class="toolbar">
      <input class="field search" id="ev-q" type="search" placeholder="내용·좌표·플레이어 검색" value="${esc(S.evQuery)}">
      <select class="field" id="ev-kind"><option value="">모든 종류</option>${kinds.map(k => `<option ${k === S.evKind ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select>
      <select class="field" id="ev-player"><option value="">모든 플레이어</option>${people.map(k => `<option ${k === S.evPlayer ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select>
    </div><div class="card" style="overflow:auto"><table class="events"><thead><tr><th>게임 날짜</th><th>시각</th><th>플레이어</th><th>종류</th><th>내용</th><th>좌표</th><th data-tip="실제 시간(현실 시각)입니다.">현실 시각</th></tr></thead><tbody id="ev-body"></tbody></table></div><div id="ev-more"></div>`;
  const draw = () => {
    const ql = S.evQuery.toLowerCase();
    const rows = d.events.filter(e => (!S.evKind || e[5] === S.evKind) && (!S.evPlayer || e[3] === S.evPlayer) && (!ql || e.join(' ').toLowerCase().includes(ql)));
    $('ev-body').innerHTML = rows.slice(0, S.evLimit).map(e => `<tr><td class="mono">${esc(e[1])}</td><td class="mono">${esc(e[2])}</td><td>${esc(e[3])}${e[4] ? ` <span class="note">#${esc(e[4])}</span>` : ''}</td><td>${esc(e[5])}</td><td class="detail">${esc(e[6])}</td><td class="mono note">${esc(e[7])}</td><td class="mono note">${esc(e[0].slice(5, 16))}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">조건에 맞는 사건이 없습니다.</td></tr>';
    $('ev-more').innerHTML = rows.length > S.evLimit ? `<p class="note" style="text-align:center;margin-top:12px">${num(rows.length)}건 중 ${num(S.evLimit)}건 표시 · <button class="btn" id="ev-more-btn" style="height:28px">더 보기</button></p>` : `<p class="note" style="margin-top:10px">${num(rows.length)}건 · 위치 갱신 기록은 지도에만 표시합니다.</p>`;
    const more = $('ev-more-btn'); if (more) more.onclick = () => { S.evLimit += 500; draw(); };
  };
  $('ev-q').oninput = e => { S.evQuery = e.target.value; S.evLimit = 300; draw(); };
  $('ev-kind').onchange = e => { S.evKind = e.target.value; S.evLimit = 300; draw(); };
  $('ev-player').onchange = e => { S.evPlayer = e.target.value; S.evLimit = 300; draw(); };
  draw();
}

const FILE_NAMES = {'events.jsonl':'원본 기록 (JSON 줄)','dated-events.csv':'전체 사건 (CSV)','story.md':'세션 이야기','diary.md':'생존 일지'};
function renderFiles(pane){
  const d = S.detail;
  const row = f => { const name = f.path.split(/[\\/]/).pop(), ext = (name.split('.').pop() || '').toUpperCase();
    return `<li><button data-file="${esc(f.path)}"><span class="ext">${esc(ext.slice(0, 4))}</span><span><b>${esc(FILE_NAMES[name] || name)}</b>${FILE_NAMES[name] ? ` <span class="note">${esc(f.path)}</span>` : ''}</span><span class="note mono">${f.size ? num(Math.max(1, Math.round(f.size / 1024))) + ' KB' : '자동 생성'}</span></button></li>`; };
  pane.innerHTML = `<div class="card files"><ul>${d.files.map(row).join('')}</ul></div><p class="note" style="margin-top:12px">${PUBLIC ? '누르면 새 탭에서 엽니다.' : '누르면 이 PC의 기본 앱으로 엽니다.'}</p>`;
}
async function openFile(path){
  if (PUBLIC){ window.open(fileUrl(path), '_blank'); return; }
  try { await api('/api/open', {id:S.id, path}); } catch (e) { showError('파일을 열지 못했습니다', e.message); }
}

/* ---------- server settings ---------- */
function fmtValue(s, v){
  if (typeof v === 'boolean') return v ? '켬' : '끔';
  if (v === null || v === undefined) return '—';
  if (s && s.options && s.options[v] !== undefined) return s.options[v];
  if (typeof v === 'number') return v.toLocaleString(undefined, {maximumFractionDigits:4});
  return String(v);
}
const ruleValue = v => v === 'true' ? '<span class="on-off">켬</span>' : v === 'false' ? '<span class="on-off off">끔</span>' : `<b>${esc(v || '—')}</b>`;
function setView(view){
  S.view = view; save();
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-selected', b.dataset.view === view));
  document.querySelector('.shell').classList.toggle('cfg', view === 'config');
  $('config').hidden = view !== 'config';
  if (view === 'config') renderConfig();
}
async function renderConfig(){
  const box = $('config');
  if (!S.config){
    box.innerHTML = '<div class="empty"><div class="spin"></div>서버 설정을 읽는 중…</div>';
    try { S.config = await api('/api/config'); } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  }
  const c = S.config, changed = c.settings.filter(s => s.changed);
  const groups = {};
  changed.forEach(s => (groups[s.section] = groups[s.section] || []).push(s));
  const house = Object.entries(groups).map(([sec, list]) => `<div class="house-group"><h4>${esc(sec ? c.sections[sec] || sec : '기본 설정')}</h4><div class="card">${
    list.map(s => `<div class="house-row" data-tip="${esc(s.desc)}"><span class="lbl">${esc(s.label)}</span><span class="val">${esc(fmtValue(s, s.value))}</span><span class="def">기본값 ${esc(fmtValue(s, s.default))}</span></div>`).join('')}</div></div>`).join('');
  const mods = c.mods.map(m => `<button class="mod" data-mod="${esc(m.workshop || '')}" data-tip="${esc((m.description || m.id) + (m.workshop ? '\n누르면 창작마당 페이지를 엽니다.' : ''))}">${
    m.poster ? `<img alt="" loading="lazy" src="${posterUrl(m.id)}">` : `<span class="ph">${esc(m.name.slice(0, 2).toUpperCase())}</span>`}<span style="min-width:0"><div class="n">${esc(m.name)}</div><div class="i">${esc(m.id)}${m.found ? '' : ' · 파일 없음'}</div></span></button>`).join('');
  const updated = new Date(c.updated * 1000);
  box.innerHTML = `<div class="config-inner">
    <div><h1>${esc(c.server)} 서버 설정</h1><div class="sub" style="color:var(--muted);font-size:13px">지도 ${esc(c.map || '—')} · 모드 ${c.mods.length}개 · 설정 파일 수정 ${updated.toLocaleDateString()} ${updated.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div></div>
    <section><h3 class="section-title" data-tip="샌드박스 설정 중 바닐라 기본값과 다르게 바꾼 것만 모았습니다.">하우스 룰 · 기본값에서 바꾼 설정 ${changed.length}개</h3>
      <div class="house">${house || '<div class="card empty">기본값에서 바꾼 샌드박스 설정이 없습니다.</div>'}</div></section>
    <section><h3 class="section-title">모드 ${c.mods.length}개</h3><div class="mods">${mods || '<div class="card empty">켜진 모드가 없습니다.</div>'}</div></section>
    <section><h3 class="section-title" data-tip="서버 .ini에서 플레이에 영향을 주는 설정만 보여 줍니다. 비밀번호는 읽지 않습니다.">서버 규칙</h3>
      <div class="rules">${c.rules.map(r => `<div class="rule"><span>${esc(r.label)}</span>${ruleValue(r.value)}</div>`).join('')}</div></section>
    <details class="all" id="all-settings"><summary>모든 샌드박스 설정 ${c.settings.length}개</summary><div style="margin-top:12px"></div></details>
  </div>`;
  $('all-settings').addEventListener('toggle', e => { if (e.target.open) renderAllSettings(e.target.querySelector('div')); }, {once:true});
}
function renderAllSettings(box){
  const c = S.config;
  const sections = [...new Set(c.settings.map(s => s.section))];
  box.innerHTML = `<div class="toolbar"><input class="field search" id="cfg-q" type="search" placeholder="설정 이름·설명 검색"><select class="field" id="cfg-sec"><option value="">모든 분류</option>${sections.map(s => `<option value="${esc(s)}">${esc(s ? c.sections[s] || s : '기본 설정')}</option>`).join('')}</select><label class="note" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="cfg-changed"> 바꾼 것만</label></div><div class="card" style="overflow:auto"><table><thead><tr><th>분류</th><th>설정</th><th class="num">값</th><th class="num">기본값</th></tr></thead><tbody id="cfg-body"></tbody></table></div>`;
  const draw = () => {
    const ql = $('cfg-q').value.toLowerCase(), sec = $('cfg-sec').value, only = $('cfg-changed').checked;
    const rows = c.settings.filter(s => (!sec || s.section === sec) && (!only || s.changed) && (!ql || (s.label + ' ' + s.desc + ' ' + s.path).toLowerCase().includes(ql)));
    $('cfg-body').innerHTML = rows.map(s => `<tr class="${s.changed ? 'changed' : ''}" data-tip="${esc(s.desc)}"><td class="note">${esc(s.section ? c.sections[s.section] || s.section : '기본')}</td><td><b>${esc(s.label)}</b> <span class="note mono">${esc(s.path.split('.').pop())}</span></td><td class="num">${esc(fmtValue(s, s.value))}</td><td class="num note">${esc(fmtValue(s, s.default))}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">조건에 맞는 설정이 없습니다.</td></tr>';
  };
  ['cfg-q', 'cfg-sec', 'cfg-changed'].forEach(id => $(id).addEventListener('input', draw));
  draw();
}
$('config').addEventListener('click', e => { const m = e.target.closest('[data-mod]'); if (m && m.dataset.mod) window.open('https://steamcommunity.com/sharedfiles/filedetails/?id=' + m.dataset.mod, '_blank'); });
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));

/* ---------- actions ---------- */
$('list').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (!b || b.dataset.id === S.id) return; S.id = b.dataset.id; S.dayIdx = -1; S.evQuery = S.evKind = S.evPlayer = ''; S.mapKey = null; save(); renderList(); loadDetail(); });
$('pane').addEventListener('click', e => {
  const day = e.target.closest('[data-day]'); if (day){ S.dayIdx = +day.dataset.day; renderDays($('pane')); return; }
  const file = e.target.closest('[data-file]'); if (file) openFile(file.dataset.file);
});
document.querySelectorAll('.tab').forEach(b => b.onclick = () => setTab(b.dataset.tab));
$('refresh').onclick = () => { S.detail = null; S.mapKey = null; S.config = null; loadState().then(() => S.view === 'config' && renderConfig()); };
$('open-folder').onclick = () => openFile('');
$('rec').onclick = async () => {
  const st = S.state; if (!st) return;
  if (st.watcher){
    const ok = await modal({title:'기록을 멈출까요?', body:'<p>기록기를 멈춥니다. 게임 서버는 계속 실행되며, 멈춘 동안의 플레이는 기록되지 않습니다. 세션은 "미마감"으로 남습니다.</p>', actions:[{label:'취소'}, {label:'기록 멈추기', primary:true, value:true}]});
    if (!ok) return;
  }
  try { await api('/api/watcher', {}); S.detail = null; loadState(); } catch (e) { showError('기록기를 바꾸지 못했습니다', e.message); }
};
$('ai').onclick = async () => {
  const d = S.detail; if (!d || !d.has_events) return;
  const again = d.story ? '<p>지금 있는 이야기와 일지를 새로 쓴 내용으로 바꿉니다.</p>' : '';
  const ok = await modal({title:'AI 요약을 갱신할까요?', body:`<p>지금까지의 기록으로 세션 이야기와 날짜별 생존 일지를 AI(Claude)가 씁니다. 1~2분 걸리고, Claude API 사용료가 조금 듭니다.</p>${again}`, actions:[{label:'취소'}, {label:'갱신하기', primary:true, value:true}]});
  if (!ok) return;
  const b = $('ai'); b.disabled = true; toast('<span class="spin"></span><span>AI가 이야기를 쓰는 중… (1~2분)</span>');
  try { const r = await api('/api/summarize', {id:d.id}); toast(`AI 요약 완료 · 일지 ${r.days}일`, 4000); S.detail = null; await loadState(); }
  catch (e) { $('toast').hidden = true; showError('AI 요약을 하지 못했습니다', e.message); }
  finally { b.disabled = false; }
};
$('finalize').onclick = async () => {
  const d = S.detail; if (!d) return;
  const warn = d.state === 'live' ? '<p><b>아직 기록 중인 세션입니다.</b> 마감하면 기록을 먼저 멈춥니다. 다시 기록을 시작하면 새 세션으로 모입니다.</p>' : '';
  const ok = await modal({title:`${recName(d.name)} 세션을 마감할까요?`, body:`${warn}<p>기록을 확정하고 친구들에게 공개합니다. 사건 CSV 파일도 함께 만듭니다.</p>`, actions:[{label:'취소'}, {label:'마감하기', primary:true, value:true}]});
  if (!ok) return;
  try { await api('/api/finalize', {id:d.id}); S.detail = null; await loadState(); toast('마감 완료', 3000); } catch (e) { showError('마감하지 못했습니다', e.message); }
};
$('share').onclick = async () => {
  await loadState();
  const link = S.state ? S.state.friend_url : '', net = S.state ? S.state.internet_url : '';
  await modal({title:'친구용 주소', body:`<p>친구 화면은 읽기 전용이며, 진행 중인 세션도 실시간으로 보입니다.</p>
    <p><b>고정 주소</b> · 친구들에게는 이것만 주면 됩니다. 지금 켜진 사이트로 자동으로 넘어갑니다.</p><div class="link-box"><input class="field mono" readonly value="https://selenil989.github.io/pz/"></div>
    <p class="note">이번 실행의 터널 주소: ${esc(net || '준비 중…')}</p>
    <p><b>Radmin 주소</b> · Radmin VPN 네트워크에 들어온 친구만.</p><div class="link-box"><input class="field mono" readonly value="${esc(link)}"></div>`,
    actions:[{label:'고정 주소 복사', primary:true, run:b => copy('https://selenil989.github.io/pz/', b)}, {label:'Radmin 주소 복사', run:b => copy(link, b)}, {label:'닫기'}]});
};
$('more').onclick = e => {
  e.stopPropagation();
  const old = document.querySelector('.menu'); if (old){ old.remove(); return; }
  const menu = document.createElement('div'); menu.className = 'menu'; menu.setAttribute('role', 'menu');
  menu.innerHTML = `<button data-act="server-folder">기록 폴더 열기</button><button data-act="log">오류 로그 열기</button>`;
  const r = $('more').getBoundingClientRect(); menu.style.top = r.bottom + 6 + 'px'; menu.style.right = innerWidth - r.right + 'px';
  document.body.append(menu);
  menu.onclick = async ev => { const act = ev.target.closest('[data-act]'); if (!act) return; menu.remove();
    try { await api('/api/open', act.dataset.act === 'log' ? {log:true} : {}); } catch (err) { showError('열지 못했습니다', err.message); } };
};
document.addEventListener('click', e => { const m = document.querySelector('.menu'); if (m && !m.contains(e.target)) m.remove(); });

loadState().then(() => setView(S.view));
</script>
</body>
</html>
