<!DOCTYPE html>
<html lang="ko" data-public="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세션 동선 지도</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<style>
/* Map-first workbench (same layout and behaviour as the reference page): map + timeline left, people / chronological panel right. */
:root{--casing:#FFFFFF;--wash:rgba(236,238,232,.18);--danger:var(--rec)}
@media (prefers-color-scheme: dark){:root{--casing:#0D0F11;--wash:rgba(14,17,20,.40)}}
html,body{height:100%;margin:0}
body{overflow:hidden}
[hidden]{display:none!important}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding:14px 16px;box-sizing:border-box}
.top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.eyebrow{margin:0;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top h1{margin:2px 0 0;font-size:24px;font-weight:700;letter-spacing:-.02em}
.top .sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.embedded .top>div:first-child{display:none}.embedded .top{justify-content:flex-end}.embedded .app{padding-top:10px}
.mtabs{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.mtabs button{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer}
.mtabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

.map{grid-column:1;grid-row:2;position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface);min-height:300px;touch-action:none}
.map>canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.map>canvas.dragging{cursor:grabbing}.map>canvas.pointing{cursor:pointer}
.layers{position:absolute;top:10px;left:10px;right:64px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.chip{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:999px;border:1px solid var(--line);background:var(--raised);color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chip svg{width:14px;height:14px;flex:none}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.chip[aria-pressed="false"] svg{opacity:.4}
.chip .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.zoom{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--raised);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.zoom button{width:36px;height:34px;border:0;background:none;cursor:pointer;font-size:18px;line-height:1;color:var(--ink)}
.zoom button+button{border-top:1px solid var(--line)}
.zoom button:hover{background:var(--band)}
.legend{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:6px 10px;border-radius:8px;background:var(--raised);border:1px solid var(--line);font-size:12px;color:var(--muted);max-width:calc(100% - 200px)}
.legend i{display:inline-block;vertical-align:middle;width:22px;height:0;border-top:3px solid var(--ink);margin-right:6px}
.legend i.dash{border-top-style:dashed}
.legend .bub{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:3px solid var(--accent);font:600 10px var(--f-mono);color:var(--ink);margin-right:6px;vertical-align:middle}
.coords{position:absolute;right:10px;bottom:10px;font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:3px 7px;text-align:right}
.coords .place{display:block;font-family:var(--f-body);color:var(--ink)}

.tip{position:absolute;pointer-events:none;z-index:40;max-width:280px;padding:7px 10px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.45;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.tip b{font-weight:600}
.pop{position:absolute;z-index:5;width:300px;max-width:calc(100% - 20px);max-height:min(380px,calc(100% - 20px));display:flex;flex-direction:column;border-radius:var(--r);background:var(--raised);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.22)}
.pop header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:move;user-select:none;touch-action:none}
.pop header button{cursor:pointer}
.pop.moving{box-shadow:0 16px 40px rgba(0,0,0,.3)}
.pop header strong{font-size:13px}
.pop .x{border:0;background:none;cursor:pointer;font-size:18px;color:var(--muted);padding:0 4px}
.pop ul{list-style:none;margin:0;padding:4px;overflow:auto}
.pop .sum{margin:6px 12px 0;font-size:12px;color:var(--muted)}
.pop.state{width:320px}
.st{padding:10px 14px 12px;overflow:auto;display:grid;gap:10px;font-size:13px}
.st h4{margin:0 0 4px;font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--muted)}
.st .row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.st .big{font-family:var(--f-mono);font-weight:600;font-size:16px}
.st .chips{display:flex;flex-wrap:wrap;gap:4px}
.st .chips span{font-size:12px;padding:1px 8px;border-radius:6px;background:var(--band)}
.st .pill{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.st .pill.on{color:var(--live);border-color:currentColor}
.st .pill.dead{color:var(--danger);border-color:currentColor}
.st ul{margin:0;padding-left:16px}
.st .note{font-size:12px;color:var(--muted)}
.detail .st{padding:0}
.pop .act{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}
.mbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap;flex:none}
.mbtn:hover{border-color:var(--ink)}
.mbtn[disabled]{opacity:.45;cursor:default;border-color:var(--line)}
.mbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* event rows (popover, feed, person detail) */
.ev button{width:100%;display:grid;grid-template-columns:42px 16px minmax(0,1fr);align-items:center;gap:8px;padding:6px 8px;border:0;background:none;border-radius:6px;text-align:left;cursor:pointer;color:var(--ink)}
.ev button:hover{background:var(--band)}
.ev time{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.3}
.ev svg{width:14px;height:14px;display:block}
.ev .what{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev button:hover .what,.ev button:focus-visible .what{white-space:normal;overflow:visible;word-break:keep-all}
.ev .who{font-weight:600;margin-right:6px}
.ev.future{opacity:.35}
.ev.now button{background:var(--band);box-shadow:inset 3px 0 0 var(--accent)}

.timeline{grid-column:1;grid-row:3;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);padding:10px 12px 8px;min-width:0}
.tl-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:6px}
.play{width:38px;height:38px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center;flex:none}
.play svg{width:16px;height:16px;pointer-events:none}
.clock{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.clock .g{font-family:var(--f-mono);font-size:18px;font-weight:600}
.clock .r{font-size:12px;color:var(--muted)}
.tl-note{font-size:12px;color:var(--muted)}
.live-btn{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.live-btn.on{color:var(--rec);border-color:var(--rec)}
.speed{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.speed button{border:0;background:none;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--muted);font-family:var(--f-mono)}
.speed button+button{border-left:1px solid var(--line)}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tl-wrap{position:relative}
.tl-wrap canvas{display:block;width:100%;touch-action:none}

.panel{grid-column:2;grid-row:2/4;min-height:0;display:flex;flex-direction:column;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);overflow:hidden}
.panel-head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.panel-head h2{margin:0;font-size:15px;font-weight:700}
.panel-head p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.panel-body{flex:1;min-height:0;overflow:auto;position:relative;padding:8px}
.panel ul{list-style:none;margin:0;padding:0}
.person{width:100%;display:grid;grid-template-columns:36px minmax(0,1fr) auto;grid-template-areas:"sw name status" "sw stats stats";gap:2px 10px;align-items:center;padding:10px;border:1px solid transparent;border-radius:8px;background:none;text-align:left;cursor:pointer;color:var(--ink)}
.person:hover{background:var(--band)}
.person[aria-pressed="true"]{background:var(--raised);border-color:var(--line)}
.sw{grid-area:sw;width:36px;height:36px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);overflow:hidden}
.sw svg{width:100%;height:100%;display:block}
.pname{grid-area:name;font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname .lives{font-size:11px;font-weight:600;color:var(--muted)}
.status{grid-area:status;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.status.dead{color:var(--danger);border-color:currentColor}
.status.on{color:var(--live);border-color:currentColor}
.pstats{grid-area:stats;font-size:12px;color:var(--muted)}
.pstats b{color:var(--ink);font-weight:600;font-family:var(--f-mono)}
.detail{margin:0 0 10px 27px;padding:4px 10px 10px;border-left:3px solid var(--c)}
.detail h3{margin:10px 0 6px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.detail h3.life{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:0;color:var(--c)}
.traits{display:flex;flex-wrap:wrap;gap:4px}
.traits span{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--band)}
.spark{width:100%;height:46px;display:block}
.detail .ev button{padding:4px 6px}
.now-row{display:flex;flex-wrap:wrap;gap:6px;padding:4px 4px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.now-row:empty{display:none}
.who-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:999px;border:1px solid var(--line);background:var(--raised);font-size:12px;cursor:pointer;color:var(--ink)}
.who-chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.who-chip.off{color:var(--muted)}
.who-chip.off i{background:none;box-shadow:inset 0 0 0 2px var(--c)}
.who-chip.gone{color:var(--muted);text-decoration:line-through}
.who-chip[aria-pressed="true"]{border-color:var(--ink);font-weight:600}
.day{position:sticky;top:-8px;z-index:1;padding:8px 8px 4px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);background:var(--surface)}
.filter-note{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 4px 8px;padding:6px 10px;border-radius:8px;background:var(--band);font-size:12px}
.filter-note button{border:0;background:none;cursor:pointer;font-weight:600;color:var(--accent)}
.empty{padding:24px 12px;color:var(--muted);font-size:13px;text-align:center}
@media (max-width:920px),(max-height:520px){
  body{overflow:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr)}
  .map{grid-row:auto;height:62vh;min-height:320px}
  .timeline{grid-row:auto}
  .panel{grid-column:1;grid-row:auto;max-height:70vh}
  .legend{display:none}
  .layers{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chip{flex:none}
  .chip .n{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <p class="eyebrow" id="eyebrow">PROJECT ZOMBOID</p>
      <h1>세션 동선 지도</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="mtabs" role="tablist" aria-label="보기 방식">
      <button role="tab" id="tab-people" aria-selected="true">인물별</button>
      <button role="tab" id="tab-time" aria-selected="false">시간순</button>
    </div>
  </header>

  <div class="map" id="map">
    <canvas id="mapc" aria-label="관측 위치 지도"></canvas>
    <div class="layers" id="layers"></div>
    <div class="zoom">
      <button id="zin" aria-label="확대">+</button>
      <button id="zout" aria-label="축소">−</button>
      <button id="zfit" aria-label="전체 맞춤" title="전체 맞춤">⤢</button>
    </div>
    <div class="legend"><span><i></i>도보</span><span><i class="dash"></i>차량</span><span><span class="bub">5</span>가까운 기록 묶음 · 누르면 펼침</span></div>
    <div class="coords" id="coords" hidden></div>
    <div class="tip" id="tip" hidden></div>
    <div class="pop" id="pop" hidden></div>
  </div>

  <section class="timeline" aria-label="타임라인">
    <div class="tl-bar">
      <button class="play" id="play" aria-label="재생" data-playing="false"><svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z" fill="currentColor"/></svg></button>
      <div class="clock"><span class="g" id="clock-g">—</span><span class="r" id="clock-r"></span></div>
      <button class="live-btn" id="live" hidden>● 실시간</button>
      <span class="tl-note" id="tl-note"></span>
      <div class="speed" id="speed" role="group" aria-label="재생 속도" hidden>
        <button data-v="60" aria-pressed="false">1분/초</button>
        <button data-v="300" aria-pressed="true">5분/초</button>
        <button data-v="900" aria-pressed="false">15분/초</button>
      </div>
    </div>
    <div class="tl-wrap" id="tlwrap"><canvas id="tlc" aria-label="인물별 접속 타임라인"></canvas></div>
  </section>

  <aside class="panel">
    <div class="panel-head"><h2 id="ph-title"></h2><p id="ph-sub"></p></div>
    <div class="panel-body" id="pbody"></div>
  </aside>
</div>
<script>

/* ---------- data: rows arrive live from /api/track and are folded into characters + events ---------- */
// row: [who, x, y, gameDate, gameTime, kind, detail, label, realMs, kills, extra]
let rows = [];
const P = [], byWho = new Map(), PLAYERS = [], colorOf = {}, EV = [];
const S = { mode: 'people', sel: new Set(), T: 0, playing: false, speed: 300, flash: null, live: false, follow: true,
  layers: { death: true, sleep: true, skill: true, bite: true, injury: false, item: false, car: false, conn: false, kill: false, enter: false } };
try { const saved = JSON.parse(localStorage.getItem('pzmap-layers') || 'null'); if (saved) Object.assign(S.layers, saved); } catch (e) {}
const A = () => rows.length ? rows[0][8] : Date.now();
const B = () => Math.max(rows.length ? rows[rows.length - 1][8] : Date.now(), S.live ? Date.now() : 0);

function ingest(data){
  for (const r of data){
    rows.push(r);
    const [who, x, y, gd, gt, k, d, label, t, kills, extra] = r, player = who.replace(/ #\d+$/, '');
    if (!(player in colorOf)){ colorOf[player] = COLORS[PLAYERS.length % COLORS.length]; PLAYERS.push(player); }
    let p = byWho.get(who);
    if (!p){
      p = { id: P.length, label: who, player, color: colorOf[player], points: [], evs: [], spans: [], deathEv: null, killSeries: [], dist: 0, carDist: 0,
        name: '', prof: '', traits: [], profiles: [], inCar: false, bbox: [Infinity, Infinity, -Infinity, -Infinity] };
      P.push(p); byWho.set(who, p);
    }
    if (k === 'vehicle_in') p.inCar = true; else if (k === 'vehicle_out' || k === 'death') p.inCar = false;
    if (x != null){
      const prev = p.points[p.points.length - 1];
      if (prev){ const dd = Math.hypot(x - prev[1], y - prev[2]); if (dd < 300){ p.dist += dd; if (p.inCar) p.carDist += dd; } }   // >300 tiles = respawn, not travel
      p.points.push([t, x, y, p.inCar]);
      const b = p.bbox; b[0] = Math.min(b[0], x); b[1] = Math.min(b[1], y); b[2] = Math.max(b[2], x); b[3] = Math.max(b[3], y);
    }
    // online spans: a logout or a gap over 2 minutes ends one
    const sp = p.spans[p.spans.length - 1];
    if (k === 'leave'){ if (sp) sp[1] = t; p.closed = true; }
    else if (!sp || p.closed || t - sp[1] > 120000){ p.spans.push([t, t]); p.closed = false; }
    else sp[1] = t;
    if (kills != null && (!p.killSeries.length || p.killSeries[p.killSeries.length - 1][1] !== kills)) p.killSeries.push([t, kills]);
    if (k === 'newchar' && extra){ p.name = extra.n; p.prof = extra.prof; p.traits = extra.traits ? extra.traits.split(/,\s*/) : []; }
    if (k === 'profile'){ if (extra) p.profiles.push([t, extra]); continue; }   // state snapshots, not feed events
    if (k === 'pos') continue;
    const e = { p, t, k, d: d || '', label, x, y, gd, gt, extra };
    p.evs.push(e); EV.push(e);
    if (k === 'death' && !p.deathEv) p.deathEv = e;
  }

}
const killsOf = p => p.killSeries.length ? p.killSeries[p.killSeries.length - 1][1] - p.killSeries[0][1] : 0;
const online = p => p.spans.reduce((a, s) => a + s[1] - s[0], 0);

/* ---------- helpers ---------- */
const hm = t => { const d = new Date(t); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
const md = gd => { const [, m, d] = gd.split('-').map(Number); return `${m}월 ${d}일`; };
const days = () => { const out = []; for (const r of rows) if (!out.length || out[out.length - 1].date !== r[3]) out.push({ date: r[3], t: r[8] }); return out; };
const dayNo = date => [...new Set(rows.map(r => r[3]))].indexOf(date) + 1;

const km = tiles => (tiles / 1000).toFixed(1) + 'km';
function placeName(x, y){
  let best = null, bd = Infinity;
  for (const [n, tx, ty] of TOWNS){ const d = Math.hypot(x - tx, y - ty); if (d < bd){ bd = d; best = [n, tx, ty]; } }
  if (bd < 150) return best[0] + ' 중심부';
  const a = (Math.atan2(-(y - best[2]), x - best[1]) * 180 / Math.PI + 360) % 360, D = ['동', '북동', '북', '북서', '서', '남서', '남', '남동'][Math.round(a / 45) % 8];

function describe(e){
  switch (e.k){
    case 'levelup': { const x = e.extra; return x ? `${SKILLS[x.perk] || x.perk} Lv ${x.level}` : e.d; }
    case 'bitten': return '물림' + (e.d ? ' · ' + e.d : '');
    case 'injury': return '부상 · ' + e.d;
    case 'weapon': return '장비 · ' + e.d;
    case 'enter': return '건물 · ' + (ROOMS[e.d] || e.d);
    case 'kill': return `좀비 처치 · ${e.extra ? e.extra.count : (e.d.match(/\d+/) || [''])[0]}마리`;
    case 'newchar': { const x = e.extra; return '새 캐릭터' + (x ? ' · ' + [x.n, x.prof].filter(Boolean).join(' · ') : ''); }

    case 'sleep': return e.extra ? '숙박 · 잠으로 ' + fmtDur(e.extra.mins * 60e3) + ' 건너뜀' : '숙박';

/* ---------- view ---------- */
const mapEl = $('map'), canvas = $('mapc'), ctx = canvas.getContext('2d');
const tlCanvas = $('tlc'), tctx = tlCanvas.getContext('2d');

let W = 0, H = 0, DPR = 1, MIN_S = .02, tween = null, hits = [], frame = 0, fitted = false;
const MAX_S = 8;   // 8 screen px per game tile
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const toS = (x, y) => [(x - view.ox) * view.s, (y - view.oy) * view.s];
const toW = (sx, sy) => [sx / view.s + view.ox, sy / view.s + view.oy];
function req(){ if (!frame) frame = requestAnimationFrame(tick); }
function clampView(){

  view.ox = clamp(cx, 0, WORLD.w) - W / 2 / view.s; view.oy = clamp(cy, 0, WORLD.h) - H / 2 / view.s;
}
function setView(s, cx, cy, animate = true){

}
function zoomAt(f, sx, sy){
  const [wx, wy] = toW(sx, sy), s = clamp(view.s * f, MIN_S, MAX_S);
  view.s = s; view.ox = wx - sx / s; view.oy = wy - sy / s; clampView(); tween = null; req();
}
const unionBox = ps => { const bs = ps.map(p => p.bbox).filter(b => b[0] !== Infinity); return bs.length ? [Math.min(...bs.map(b => b[0])), Math.min(...bs.map(b => b[1])), Math.max(...bs.map(b => b[2])), Math.max(...bs.map(b => b[3]))] : [10200, 9300, 11300, 10500]; };
const allBox = () => unionBox(P);
const selBox = () => unionBox(P.filter(isSel));

/* ---------- selection ---------- */
const isSel = p => S.sel.has(p.player);
const visiblePerson = p => !S.sel.size || isSel(p);
const dimmed = p => S.sel.size > 0 && !isSel(p);
const livesOf = name => P.filter(p => p.player === name);
const selNames = () => [...S.sel].map(n => `<b style="color:${colorOf[n]}">${esc(n)}</b>`).join(', ');
function posAt(p, T){
  const pts = p.points, i = countLE(pts, T) - 1; if (i < 0) return null;
  const a = pts[i], b = pts[i + 1];
  if (b && b[0] - a[0] < 120000 && b[0] > a[0] && Math.hypot(b[1] - a[1], b[2] - a[2]) < 300){ const f = (T - a[0]) / (b[0] - a[0]); return { x: a[1] + (b[1] - a[1]) * f, y: a[2] + (b[2] - a[2]) * f, i, v: b[3] }; }

}
const inSpan = (p, T) => p.spans.some(s => T >= s[0] - 30000 && T <= s[1] + 90000);
const alive = (p, T) => !(p.deathEv && p.deathEv.t <= T);

/* ---------- map drawing ---------- */
const tiles = new Map();
function drawTiles(){
  const L = clamp(Math.round(Math.log2(1 / view.s)), 0, 4), span = 256 * 2 ** L;
  const [wx0, wy0] = toW(0, 0), [wx1, wy1] = toW(W, H);
  ctx.imageSmoothingEnabled = view.s * span / 256 < 2;
  for (let ty = Math.max(0, Math.floor(wy0 / span)); ty <= Math.min(Math.ceil(WORLD.h / span) - 1, Math.floor(wy1 / span)); ty++)
    for (let tx = Math.max(0, Math.floor(wx0 / span)); tx <= Math.min(Math.ceil(WORLD.w / span) - 1, Math.floor(wx1 / span)); tx++){
      const key = `${L}/tile${tx}x${ty}`;
      let img = tiles.get(key);
      if (!img){ img = new Image(); img.onload = req; img.src = `maptiles/${key}.png`; tiles.set(key, img); }
      if (img.complete && img.naturalWidth){ const [sx, sy] = toS(tx * span, ty * span); ctx.drawImage(img, sx, sy, span * view.s + .5, span * view.s + .5); }
    }

function strokeRun(pts, i0, i1, tail, color, alpha, w){

  for (const pass of [0, 1]){
    ctx.globalAlpha = pass ? alpha : alpha * .8;
    ctx.strokeStyle = pass ? color : K.casing; ctx.lineWidth = pass ? w : w + 3;
    let veh = null; ctx.beginPath();
    const seg = (a, b, v) => {
      if (Math.hypot(b[0] - a[0], b[1] - a[1]) > 300 * view.s){ veh = null; ctx.stroke(); ctx.beginPath(); return; }   // respawn jump: no line
      if (v !== veh){ if (veh !== null){ ctx.setLineDash(veh && pass ? [7, 5] : []); ctx.stroke(); ctx.beginPath(); } veh = v; ctx.moveTo(...a); }
      ctx.lineTo(...b);

    if (best) best.items.push(it); else out.push({ sx: it.sx, sy: it.sy, items: [it] });
  }

}
const onLayer = e => S.layers[kindOf(e.k).group];
function drawLabel(text, x, y, color){

function draw(){

  }

// If rows already drawn changed (not just appended), start over with every chunk.
async function fetchRows(rec){
  if (!STATIC) return fetch('/api/track?id=' + encodeURIComponent(SID) + '&from=' + rows.length, { cache: 'no-store' }).then(r => r.json());
  const vers = (rec && rec.track && rec.track.vers) || [], name = String(SID).replace('session:', '');
  for (let attempt = 0; attempt < 2; attempt++){
    const out = [];
    let restart = false;
    for (let k = 0; k < vers.length; k++){
      if (chunkVers[k] === vers[k]) continue;
      const part = await fetch(STATIC + 'tracks/' + name + '/' + k + '.json?v=' + vers[k], { cache: 'no-store' }).then(r => r.json());
      const have = Math.max(0, Math.min(CHUNK, rows.length - k * CHUNK));
      if (have && JSON.stringify(part.slice(0, have)) !== JSON.stringify(rows.slice(k * CHUNK, k * CHUNK + have))){ restart = true; break; }
      out.push(...part.slice(have)); chunkVers[k] = vers[k];
    }
    if (!restart) return out;
    resetData();
  }
  return [];
}
async function load(){
  try {
    const st = await fetchState();
    const rec = (st.records || []).find(x => x.id === SID || x.name === SID);
    S.live = !!rec && rec.state === 'live';
    $('eyebrow').textContent = `PROJECT ZOMBOID · ${st.server || ''} · 세션 ${String(SID).replace('session:', '')}`;
    const before = rows.length;
    const data = await fetchRows(rec);
    if (rows.length < before){ renderLayers(); renderPanel(); }   // started over after a rewrite
    const fresh = Array.isArray(data) && data.length;
    if (fresh){ const nEv = EV.length; ingest(data); renderLayers(); if (!fitted) resize(); if (EV.length !== nEv || S.mode === 'people') renderPanel(); }
    if (S.follow && !S.playing) S.T = B();
    updateHeader(); updateClock(); updateFeed(); drawTimeline(); refreshStates(); req();
  } catch (e) {}
  setTimeout(load, S.live && !document.hidden ? 3000 : 15000);
}
new ResizeObserver(() => resize()).observe(mapEl);
new ResizeObserver(() => drawTimeline()).observe($('tlwrap'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readTokens(); drawTimeline(); req(); });
readTokens();
setMode(location.hash === '#time' ? 'time' : 'people', true, true);
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h === 'time' || h === 'people') setMode(h, true); });
load();
</script>
